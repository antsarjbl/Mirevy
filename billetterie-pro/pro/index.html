<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirevy Party – Billetterie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--red:#d90f0f;--red-d:#7a0808;--ink:#f2f2f2;--mute:#9a9a9a;--line:#2a2a2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 48px}
h1,h2,.big{font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:400;text-transform:uppercase;margin:0;line-height:.95}
.poster{display:block;width:100%;height:auto;margin:20px 0 0}
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(88px,30vw,150px);color:var(--red);letter-spacing:-1px}
.hero .party{display:inline-block;background:var(--ink);color:#000;font-family:Anton,Impact,sans-serif;font-size:clamp(40px,13vw,64px);padding:2px 12px;text-transform:uppercase;margin-top:-6px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0;padding:18px 0;border-top:3px solid var(--red);border-bottom:1px solid var(--line)}
.info .big{font-size:30px;color:var(--red)}
.info p{margin:4px 0 0;color:var(--mute);font-size:14px}
h2{font-size:30px;margin:32px 0 14px}
.tickets{display:grid;gap:12px}
.t{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:#0d0d0d;border:2px solid var(--line);padding:16px;border-radius:0;cursor:pointer}
.t:focus-visible{outline:3px solid #fff;outline-offset:2px}
.t[aria-checked=true]{border-color:var(--red);background:#1a0505}
.t[disabled]{opacity:.45;cursor:not-allowed}
.t b{display:block;font-size:17px}
.t small{color:var(--mute)}
.price{font-family:Anton,Impact,sans-serif;font-size:32px;color:var(--red);white-space:nowrap}
.t[disabled] .price{color:var(--mute);font-size:20px}
label{display:block;font-weight:600;margin:16px 0 6px}
input{width:100%;font:inherit;color:var(--ink);background:#0d0d0d;border:2px solid var(--line);padding:13px;border-radius:0}
input:focus-visible{outline:3px solid #fff;outline-offset:1px;border-color:var(--red)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:#ff6b6b;font-size:14px;min-height:20px;margin:10px 0 0}
.cta{width:100%;margin-top:14px;font-family:Anton,Impact,sans-serif;font-size:24px;text-transform:uppercase;letter-spacing:.5px;background:var(--red);color:#fff;border:0;padding:16px;cursor:pointer;border-radius:0}
.cta:hover{background:#f01414}.cta:focus-visible{outline:3px solid #fff;outline-offset:2px}
.note{color:var(--mute);font-size:13px;margin-top:14px}
.pass{border:2px solid var(--red);background:#120202;margin-top:28px;position:relative}
.pass .top{background:var(--red);padding:14px 18px}
.pass .top .big{font-size:44px}
.pass .body{padding:18px;border-top:2px dashed var(--red-d)}
.pass dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.pass dt{color:var(--mute)}.pass dd{margin:0;font-weight:600}
.code{font-family:Anton,Impact,sans-serif;font-size:38px;letter-spacing:3px;color:var(--red);margin-top:16px}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.pass{animation:in .35s ease-out}@keyframes in{from{transform:translateY(8px);opacity:0}}}
</style>
</head>

  <section class="info" aria-label="Infos pratiques">
    <div><span class="big">07 nov</span><p>Samedi, 23h – 05h</p></div>
    <div><span class="big">Live DJ</span><p>Shatta, zouk & dancehall</p></div>

  <div id="shop">
    <h2>Ton billet</h2>
    <div class="tickets" role="radiogroup" aria-label="Choisir un billet" id="tickets"></div>

    <div id="freeForm" class="hidden"><div class="row"><div><label for="prenom">Prénom</label><input id="prenom" autocomplete="given-name"></div><div><label for="nom">Nom</label><input id="nom" autocomplete="family-name"></div></div><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" inputmode="email"></div>
    <p class="err" id="err" role="alert"></p>
    <button class="cta" id="buy" type="button">Payer mon billet</button>
    <p class="note">Paiement sécurisé par Stripe. Ton nom et ton e-mail te sont demandés sur la page de paiement. Tu reçois ton reçu par e-mail : garde-le pour l’entrée.</p>
  </div>

  <section id="done" class="hidden" aria-live="polite"></section>
</main>

<script>
// ——— À MODIFIER : colle ici tes liens de paiement Stripe ———
var TICKETS = [
  {name:'Premier servi', desc:'Quota atteint', price:null, soldOut:true, link:''},
  {name:'Prévente', desc:'Tarif réduit', price:7, soldOut:false, link:'https://book.stripe.com/14AcMY1eX8KT4Ix3vm4F200'},
  {name:'Normale', desc:'Tarif plein', price:10, soldOut:false, link:'https://book.stripe.com/14A00c7Dlf9h1wlfe44F201'},
  {name:'Gratuit', desc:'Places limitées – inscription obligatoire', price:0, soldOut:false, link:'', free:true}
];
var selected = null;
var list = document.getElementById('tickets');
var err = document.getElementById('err');
var buy = document.getElementById('buy');

TICKETS.forEach(function(t){
  var b = document.createElement('button');
  b.type = 'button'; b.className = 't'; b.setAttribute('role','radio');
  b.setAttribute('aria-checked','false');
  if (t.soldOut) b.disabled = true;
  b.innerHTML = '<span><b>' + t.name + '</b><small>' + t.desc + '</small></span>' +
    '<span class="price">' + (t.soldOut ? 'Complet' : (t.price === 0 ? 'Gratuit' : t.price + ' €')) + '</span>';
  b.addEventListener('click', function(){
    selected = t; err.textContent = '';
    document.getElementById('freeForm').classList.toggle('hidden', !t.free);
    list.querySelectorAll('.t').forEach(function(x){ x.setAttribute('aria-checked', x === b ? 'true' : 'false'); });
    buy.textContent = t.price === 0 ? 'Réserver gratuitement' : 'Payer ' + t.price + ' €';
  });
  list.appendChild(b);
});

function reserveFree(){
  var p = document.getElementById('prenom').value.trim(), n = document.getElementById('nom').value.trim(), e = document.getElementById('email').value.trim();
  if (!p || !n) { err.textContent = 'Indique ton prénom et ton nom.'; return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { err.textContent = 'Entre une adresse e-mail valide.'; return; }
  err.textContent = ''; buy.disabled = true; buy.textContent = 'Un instant…';
  function back(m){ err.textContent = m; buy.disabled = false; buy.textContent = 'Réserver gratuitement'; }
  fetch('/.netlify/functions/api?action=free', {method:'POST', body: JSON.stringify({prenom:p, nom:n, email:e})})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
    .then(function(x){ if (!x.ok) return back(x.d.error || 'Erreur.'); location.href = '/merci.html?free=' + encodeURIComponent(x.d.code); })
    .catch(function(){ back('Connexion impossible. Réessaie.'); });
}
buy.addEventListener('click', function(){
  if (!selected) { err.textContent = 'Choisis un billet.'; return; }
  if (selected.free) return reserveFree();
  if (!/^https:\/\//.test(selected.link)) { err.textContent = 'Ce billet n’est pas encore disponible.'; return; }
  window.location.href = selected.link;
});

// Page de retour après paiement : Stripe redirige vers ton-site#merci
function showDone(){
  if (location.hash !== '#merci') return;
  document.getElementById('shop').classList.add('hidden');
  var d = document.getElementById('done');
  d.classList.remove('hidden');
  d.innerHTML = '<h2>Paiement reçu</h2>' +
    '<div class="pass"><div class="top"><span class="big">Mirevy Party</span></div>' +
    '<div class="body"><dl><dt>Date</dt><dd>Sam. 07 novembre, 23h – 05h</dd>' +
    '<dt>Lieu</dt><dd>1 av. Léon Eyrolles, Cachan</dd></dl></div></div>' +
    '<p class="note">Merci ! Ton reçu arrive par e-mail (pense à vérifier les spams). Montre-le à l’entrée avec une pièce d’identité.</p>';
  window.scrollTo(0, 0);
}
showDone();
window.addEventListener('hashchange', showDone);
</script>
